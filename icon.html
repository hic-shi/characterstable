  <meta property="og:type" content="website">

  <style>
    *, *::before, *::after { box-sizing: border-box; }

    :root {
      --bg-body: #b8b8b8;
      --bg-card: #e5e5e5;
      --border-color: #1a1a1a;
      --text-color: #1a1a1a;
      --accent-bg: #1a1a1a;
      --accent-text: #ffffff;
      --line: 2px solid var(--border-color);
    }

    body {
      display: flex;
      justify-content: center;
      margin: 0;
      background: var(--bg-body);
      color: var(--text-color);
      font-family: sans-serif;
    }
    a { color: inherit; text-decoration: none; }

    main {
      width: 100%;
      max-width: 1200px;
      min-height: 100vh;
      padding: 28px;
      background: var(--bg-card);
      border: var(--line);
      border-radius: 10px;
    }

    #top {
      margin: 3rem 0 30px;
      padding-bottom: 10px;
      font-size: 1.8rem;
      text-align: center;
      letter-spacing: 0.05em;
    }

    /* 目次 */
    .toc-toggle, .toc {
      position: fixed;
      top: 0;
      left: 50%;
      width: 100%;
      max-width: 1200px;
      background: var(--accent-bg);
      color: var(--accent-text);
      border: 1px solid var(--border-color);
    }
    .toc-toggle {
      padding: 10px 14px;
      border-radius: 0 0 10px 10px;
      font: inherit;
      text-align: center;
      cursor: pointer;
      transform: translateX(-50%);
      z-index: 12;
    }
    .toc {
      margin: 0;
      padding: 62px 18px 18px;
      border-top: none;
      border-radius: 0 0 10px 10px;
      z-index: 11;
      transform: translate(-50%, -100%);
      transition: transform 0.25s ease;
    }
    .toc.open { transform: translate(-50%, 0); }
    .toc p { margin: 0 0 6px; font-weight: bold; font-size: 0.9rem; }
    .toc ul { margin: 0; padding-left: 20px; }
    .toc li { margin-bottom: 4px; }

    /* 作者セクション */
    .author-section { margin-bottom: 40px; }
    .author-title {
      margin: 0 0 20px;
      padding-left: 10px;
      border-left: 5px solid var(--border-color);
      font-size: 1.3rem;
      line-height: 1.2;
      scroll-margin-top: 60px;
    }

    /* カード一覧グリッド */
    .character-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 16px;
    }

    /* カード（画像と名前のみ） */
    .character-card {
      display: flex;
      flex-direction: column;
      background: #fff;
      border: var(--line);
      box-shadow: 2px 2px 0 rgba(0, 0, 0, 0.15);
      overflow: hidden;
    }

    .icon-area {
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: var(--bg-body);
      border-bottom: var(--line);
    }

    .icon-area img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .character-name {
      margin: 0;
      padding: 8px 6px;
      font-size: 0.95rem;
      font-weight: bold;
      text-align: center;
      line-height: 1.3;
      overflow-wrap: anywhere;
      min-height: 2.8em;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @media (max-width: 768px) {
      body { display: block; }
      main {
        width: 100%;
        max-width: none;
        min-height: 100svh;
        padding: 64px 10px 24px;
        border-width: 0;
        border-radius: 0;
      }
      #top {
        margin: 1.2rem 0 24px;
        font-size: clamp(1.25rem, 5vw, 1.7rem);
        line-height: 1.35;
      }
      .author-section { margin-bottom: 32px; }
      .author-title {
        font-size: 1.15rem;
        margin-bottom: 14px;
        scroll-margin-top: 64px;
      }
      .character-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
      }
      .character-name {
        padding: 6px 4px;
        font-size: 0.8rem;
      }
      .toc-toggle, .toc { width: 100%; }
      .toc-toggle { left: 0; transform: none; }
      .toc { left: 0; transform: translateY(-100%); }
      .toc.open { transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .toc { transition: none; }
    }
  </style>
</head>

  const wrapper = document.getElementById("character-wrapper");

  authorDataList.forEach(authorData => {
    const section = document.createElement("section");
    section.className = "author-section";

    const heading = document.createElement("h2");
    heading.className = "author-title";
    heading.id = authorData.authorId;
    heading.textContent = authorData.authorName;
    section.appendChild(heading);

    const grid = document.createElement("div");
    grid.className = "character-grid";

    authorData.characters.forEach(item => {
      const card = document.createElement("article");
      card.className = "character-card";

      const iconArea = document.createElement("div");
      iconArea.className = "icon-area";

      if (item.icon) {
        const img = document.createElement("img");
        img.src = item.icon;
        img.alt = item.name.trim() || "キャラクターアイコン";
        img.loading = "lazy";
        iconArea.appendChild(img);
      }

      const nameEl = document.createElement("p");
      nameEl.className = "character-name";
      nameEl.textContent = item.name || "";

      card.appendChild(iconArea);
      card.appendChild(nameEl);
      grid.appendChild(card);
    });

    section.appendChild(grid);
    wrapper.appendChild(section);
  });

  const tocToggle = document.getElementById("toc-toggle");
  const tocPanel = document.getElementById("toc-panel");

  tocToggle.addEventListener("click", () => {
    const isOpen = tocPanel.classList.toggle("open");
    tocToggle.setAttribute("aria-expanded", String(isOpen));
    tocToggle.textContent = isOpen ? "閉じる ×" : "目次 ☰";
  });

  tocPanel.querySelectorAll("a").forEach(link => {
    link.addEventListener("click", () => {
      tocPanel.classList.remove("open");
      tocToggle.setAttribute("aria-expanded", "false");
      tocToggle.textContent = "目次 ☰";
    });
  });
  </script>
