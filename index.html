  <style>
    *, *::before, *::after { box-sizing: border-box; }

    :root {
      --bg-body: #b8b8b8;
      --bg-card: #e5e5e5;
      --border-color: #1a1a1a;
      --text-color: #1a1a1a;
      --accent-bg: #1a1a1a;
      --accent-text: #ffffff;
      --sub-text: #666666;
      --line: 2px solid var(--border-color);
    }

    body {
      display: flex;
      justify-content: center;
      margin: 0;
      background: var(--bg-body);
      color: var(--text-color);
      font-family: sans-serif;
    }
    a { color: inherit; text-decoration: none; }

    main {
      width: 100%;
      max-width: 1200px;
      min-height: 100vh;
      padding: 28px;
      background: var(--bg-card);
      border: var(--line);
      border-radius: 10px;
    }

    #top {
      margin: 3rem 0 30px;
      padding-bottom: 10px;
      font-size: 1.8rem;
      text-align: center;
      letter-spacing: 0.05em;
    }

    /* 目次 */
    .toc-toggle, .toc {
      position: fixed;
      top: 0;
      left: 50%;
      width: 100%;
      max-width: 1200px;
      background: var(--accent-bg);
      color: var(--accent-text);
      border: 1px solid var(--border-color);
    }
    .toc-toggle {
      padding: 10px 14px;
      border-radius: 0 0 10px 10px;
      font: inherit;
      text-align: center;
      cursor: pointer;
      transform: translateX(-50%);
      z-index: 12;
    }
    .toc {
      margin: 0;
      padding: 62px 18px 18px;
      border-top: none;
      border-radius: 0 0 10px 10px;
      z-index: 11;
      transform: translate(-50%, -100%);
      transition: transform 0.25s ease;
    }
    .toc.open { transform: translate(-50%, 0); }
    .toc p { margin: 0 0 6px; font-weight: bold; font-size: 0.9rem; }
    .toc ul { margin: 0; padding-left: 20px; }
    .toc li { margin-bottom: 4px; }

    /* 作者 */
    .author-section { margin-bottom: 40px; }
    .author-title {
      margin: 0 0 20px;
      padding-left: 10px;
      border-left: 5px solid var(--border-color);
      font-size: 1.3rem;
      line-height: 1.2;
      scroll-margin-top: 60px;
    }
    .container, .row-group { display: flex; gap: 20px; }
    .container { flex-direction: column; align-items: center; }
    .row-group { flex-wrap: wrap; justify-content: center; width: 100%; }

    /* カード */
    .character-card {
      display: flex;
      width: 560px;
      min-width: 300px;
      background: #fff;
      border: var(--line);
      box-shadow: 2px 2px 0 rgba(0, 0, 0, 0.15);
    }
    .icon-name-wrapper { display: flex; flex-direction: column; flex: 0 0 150px; }
    .icon-area {
      height: 150px;
      overflow: hidden;
      background: var(--bg-body);
      border-right: var(--line);
      border-bottom: var(--line);
    }
    .icon-area img { display: block; width: 100%; height: 100%; object-fit: cover; }

    dl { display: flex; flex-direction: column; margin: 0; padding: 4px 8px; }
    dt { color: var(--sub-text); font-size: 0.75rem; }
    dd { margin: 0; padding: 2px 0; font-weight: bold; }


    .name-dl { flex-grow: 1; }
    .name-dl dd { font-size: 1.1rem; }

    .gender-age-dl {
      border-right: var(--line);
    }

    .gender-age-dl dd {
      font-size: 0.95rem;
      overflow-wrap: anywhere;
    }

    .character-name-section {
      flex: 1;
      min-width: 0;
      border-right: none;
    }

    .character-name-section dd {
      font-size: 1.1rem;
      overflow-wrap: anywhere;
    }


    .info-list-container { display: flex; flex: 1; flex-direction: column; min-width: 0; }
    .top-info { display: flex; border-bottom: var(--line); }
    .info-dl { flex: 1; }

    .info-dl dd, .category-dl dd {
      font-size: 1.2rem;
    }


    .category-dl { border-bottom: var(--line); }
    .category-dl dt { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 2px; }
    .category-label-item.selected { padding: 0 4px; border: 1px solid #ff4444; border-radius: 50%; }

    .memo-dl { flex-grow: 1; }
    .memo-dl dd { font-size: 0.95rem; font-weight: normal; }

    @media (max-width: 768px) {
      main { padding: 20px 12px; }
      .author-section { font-size: 0.9rem; }
      .character-card { width: 100%; max-width: 560px; }
      .icon-area { width: 50px; height: 50px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .toc { transition: none; }
    }
  </style>
</head>

const wrapper = document.getElementById("character-wrapper");

authorDataList.forEach(authorData => {
  const section = document.createElement("section");
  section.className = "author-section";

  const heading = document.createElement("h1");
  heading.className = "author-title";
  heading.id = authorData.authorId;
  heading.textContent = authorData.authorName;
  section.appendChild(heading);

  const container = document.createElement("div");
  container.className = "container";

  const characters = authorData.characters;

  for (let i = 0; i < characters.length; i += 2) {
    const rowGroup = document.createElement("div");
    rowGroup.className = "row-group";

    for (let j = i; j < i + 2 && j < characters.length; j++) {
      const item = characters[j];

      const card = document.createElement("article");
      card.className = "character-card";

      const iconNameWrapper = document.createElement("div");
      iconNameWrapper.className = "icon-name-wrapper";

      const iconArea = document.createElement("div");
      iconArea.className = "icon-area";

      if (item.icon) {
        const img = document.createElement("img");
        img.src = item.icon;
        img.alt = item.name || "キャラクターアイコン";
        iconArea.appendChild(img);
      }

      iconNameWrapper.appendChild(iconArea);

      const genderAgeDl = document.createElement("dl");
      genderAgeDl.className = "name-dl gender-age-dl";

      const genderAgeDt = document.createElement("dt");
      genderAgeDt.textContent = "性別 / 年齢:";

      const genderAgeDd = document.createElement("dd");
      genderAgeDd.textContent =
        [item.gender, item.age].filter(value => value !== "").join(" / ");

      genderAgeDl.appendChild(genderAgeDt);
      genderAgeDl.appendChild(genderAgeDd);
      iconNameWrapper.appendChild(genderAgeDl);

      card.appendChild(iconNameWrapper);

      const infoContainer = document.createElement("div");
      infoContainer.className = "info-list-container";

      const topInfo = document.createElement("div");
      topInfo.className = "top-info";

      const nameDl = document.createElement("dl");
      nameDl.className = "info-dl character-name-section";

      const nameDt = document.createElement("dt");
      nameDt.textContent = "名前:";

      const nameDd = document.createElement("dd");
      nameDd.textContent = item.name || "";

      nameDl.appendChild(nameDt);
      nameDl.appendChild(nameDd);

      topInfo.appendChild(nameDl);
      infoContainer.appendChild(topInfo);

      const categoryDl = document.createElement("dl");
      categoryDl.className = "category-dl";

      const categoryDt = document.createElement("dt");
      const categories = ["自創作", "企画", "診断", "タグ", "その他"];

      categories.forEach((catName, index) => {
        if (index > 0) {
          const slash = document.createElement("span");
          slash.textContent = "/";
          categoryDt.appendChild(slash);
        }

        const span = document.createElement("span");
        span.className = "category-label-item";
        span.textContent = catName;

        if (item.category === catName) {
          span.classList.add("selected");
        }

        categoryDt.appendChild(span);
      });

      const categoryDd = document.createElement("dd");
      categoryDd.textContent = item.project_name || "";

      categoryDl.appendChild(categoryDt);
      categoryDl.appendChild(categoryDd);
      infoContainer.appendChild(categoryDl);

      const memoDl = document.createElement("dl");
      memoDl.className = "memo-dl";

      const memoDt = document.createElement("dt");

      const memoDd = document.createElement("dd");
      memoDd.textContent = item.memo || "";

      memoDl.appendChild(memoDt);
      memoDl.appendChild(memoDd);
      infoContainer.appendChild(memoDl);

      card.appendChild(infoContainer);
      rowGroup.appendChild(card);
    }

    container.appendChild(rowGroup);
  }

  section.appendChild(container);
  wrapper.appendChild(section);
});

const tocToggle = document.getElementById("toc-toggle");
const tocPanel = document.getElementById("toc-panel");

tocToggle.addEventListener("click", () => {
  const isOpen = tocPanel.classList.toggle("open");

  tocToggle.setAttribute("aria-expanded", String(isOpen));
  tocToggle.textContent = isOpen ? "閉じる ×" : "目次 ☰";
});

tocPanel.querySelectorAll("a").forEach(link => {
  link.addEventListener("click", () => {
    tocPanel.classList.remove("open");
    tocToggle.setAttribute("aria-expanded", "false");
    tocToggle.textContent = "目次 ☰";
  });
});
